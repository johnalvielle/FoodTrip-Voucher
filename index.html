<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3535">
<link rel="manifest" href="manifest.json">
<title>Our Monthly Voucher Wallet</title>
<style>
:root{--paper:#F0E8D6;--paper2:#E4D9BF;--ink:#1E3535;--soft:#4B5F5F;--gold:#B5872F;--red:#A63A2E;--redbg:#F3DCD8;--green:#3C6B4F;--greenbg:#DCEADF;--line:#C9BC9C;--white:#FBF8F0;--shadow:0 6px 20px rgba(30,53,53,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.app{max-width:1120px;margin:auto;padding:12px 12px 45px}.brand{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.brand h1{margin:0;font-size:20px}.tag{font-size:11px;color:var(--soft);font-style:italic}.tabs{display:flex;gap:4px;overflow:auto}.tab{border:1px solid var(--line);border-bottom:0;background:var(--paper2);padding:9px 12px;border-radius:8px 8px 0 0;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:var(--white)}.panel{background:var(--white);border:1px solid var(--line);border-radius:0 11px 11px 11px;padding:14px;box-shadow:var(--shadow)}button,input,select,textarea{font:inherit}.month{display:flex;align-items:center;gap:8px;margin-bottom:13px}.month button{width:34px;height:34px;border:1px solid var(--line);background:var(--paper2);border-radius:50%;font-weight:900}.month strong{background:var(--ink);color:var(--paper);padding:8px 13px;border-radius:6px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center}.num{font-size:24px;font-weight:800}.lbl{font-size:9px;color:var(--soft);margin-top:4px;letter-spacing:.5px}.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{border:1px solid var(--line);border-radius:10px;overflow:hidden}.cathead{background:var(--ink);color:var(--paper);padding:9px 11px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}.pill{padding:3px 7px;border-radius:999px;font-size:9px}.on{background:var(--greenbg);color:var(--green)}.watch{background:#F7E7BE;color:#8A6412}.full{background:#E3DCC9;color:var(--soft)}.over{background:var(--redbg);color:var(--red)}.catbody{padding:10px}.meta{font-size:10px;color:var(--soft);margin-bottom:8px}.vrow{display:flex;flex-wrap:wrap;gap:6px}.v{min-width:54px;border:1.5px dashed var(--green);background:var(--greenbg);color:var(--green);border-radius:6px;padding:7px 6px;font-size:9px;font-weight:800;cursor:pointer}.v.used{border-style:solid;background:var(--paper);color:var(--soft);position:relative}.v.used:after{content:"USED";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);color:var(--red);border:1px solid var(--red);background:#fbf8f0ee;padding:1px 3px;border-radius:3px;font-size:8px}.v.lock{opacity:.45;cursor:not-allowed}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chart{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px}.bar{display:grid;grid-template-columns:96px 1fr 38px;gap:5px;align-items:center;font-size:9px;margin:8px 0}.barbg{height:9px;background:var(--paper2);border-radius:9px;overflow:hidden}.barin{height:100%;background:var(--ink)}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field label{display:block;font-size:9px;color:var(--soft);font-weight:800;margin-bottom:3px}.field input,.field select,.field textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:12px}.field textarea{min-height:62px}.wide{grid-column:span 3}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn{border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:7px;padding:8px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn.danger{background:var(--redbg);color:var(--red)}.notice{background:var(--greenbg);color:var(--green);padding:9px;border-radius:7px;font-size:11px;font-weight:700;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:10px}th{background:var(--ink);color:var(--paper);padding:7px;text-align:left}td{padding:7px;border-bottom:1px solid var(--line)}tr:nth-child(even){background:var(--paper)}.stars{color:var(--gold);white-space:nowrap}.srow{display:grid;grid-template-columns:30px 1fr 60px 85px 70px;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.srow input{width:100%;padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}.authbox{max-width:420px;margin:30px auto;text-align:center}.authbox .field{text-align:left;margin:8px 0}.sharecode{font-size:22px;font-weight:900;letter-spacing:3px;background:var(--paper);padding:12px;border:1px dashed var(--line);border-radius:8px}.statusline{font-size:10px;color:var(--soft)}@media(max-width:720px){.summary{grid-template-columns:1fr 1fr}.cat-grid,.grid2{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.panel{padding:10px}.srow{grid-template-columns:25px 1fr 52px 65px 58px}}@media(max-width:450px){.form{grid-template-columns:1fr}.wide{grid-column:span 1}.tab{padding:8px 9px}.v{min-width:49px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
"use strict";
const cfg=window.FOODFUN_CONFIG||{};
const hasConfig=cfg.SUPABASE_URL&&cfg.SUPABASE_KEY&&!cfg.SUPABASE_URL.includes("YOUR_PROJECT");
const sb=hasConfig?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;

let state={user:null,wallet:null,month:new Date().toISOString().slice(0,7),tab:"wallet",person:localStorage.getItem("foodfun_person")||"",edit:null,channel:null};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const money=n=>"₱"+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const monthLabel=k=>{let[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"})};
const monthShift=(k,n)=>{let[y,m]=k.split("-").map(Number);return new Date(y,m-1+n,1).toISOString().slice(0,7)};
const acts=()=>state.wallet.activities.filter(a=>a.date.slice(0,7)===state.month);
const cat=id=>state.wallet.categories.find(c=>c.id===id);
const used=c=>acts().filter(a=>a.category_id===c.id).length;
const spent=c=>acts().filter(a=>a.category_id===c.id).reduce((s,a)=>s+Number(a.amount||0),0);
const avg=c=>{let r=acts().filter(a=>a.category_id===c.id&&a.rating);return r.length?r.reduce((s,a)=>s+a.rating,0)/r.length:0};
function status(u,l){if(!l)return["INACTIVE","full"];if(u>l)return["OVER LIMIT","over"];if(u===l)return["FULLY USED","full"];if(u/l>=.75)return["WATCH","watch"];return["ON TRACK","on"]}
const stars=n=>n?"★".repeat(n)+"☆".repeat(10-n):"–";
async function call(fn,args=[]){const{data,error}=await sb.rpc(fn,Object.fromEntries(args.map(([k,v])=>[k,v])));if(error)throw error;return data}
function toast(m){let t=document.createElement("div");t.textContent=m;t.style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1E3535;color:#F0E8D6;padding:9px 14px;border-radius:20px;z-index:99;font-size:11px";document.body.append(t);setTimeout(()=>t.remove(),1700)}
async function ensureAuth(){if(!sb)return;let{data}=await sb.auth.getSession();if(data.session){state.user=data.session.user;return}let x=await sb.auth.signInAnonymously();if(x.error)throw x.error;state.user=x.data.user}
async function loadWallet(id){let{data,error}=await sb.from("wallets").select("id,name,join_code,created_at,categories(*),activities(*)").eq("id",id).maybeSingle();if(error)throw error;if(!data)throw Error("Wallet not found or access denied");state.wallet={id:data.id,name:data.name,join_code:data.join_code,categories:(data.categories||[]).sort((a,b)=>a.sort_order-b.sort_order),activities:data.activities||[]};localStorage.setItem("foodfun_wallet",id)}
async function refresh(){if(state.wallet)await loadWallet(state.wallet.id);renderPanelOnly()}
function setupPage(){
 $("#app").innerHTML=`<div class="authbox"><h2>🎟 Our Monthly Voucher Wallet</h2><p class="sub">Create one shared wallet or join your partner's wallet.</p><div class="field"><label>Your name</label><input id="who" placeholder="e.g. Alvielle" value="${esc(state.person)}"></div><div class="actions" style="justify-content:center"><button class="btn primary" id="create">Create Shared Wallet</button></div><hr><div class="field"><label>Existing Wallet ID</label><input id="joinid" placeholder="8-character code"></div><div class="actions" style="justify-content:center"><button class="btn" id="join">Join Shared Wallet</button></div><p class="small">Your login is anonymous; no email or phone number is required.</p></div>`;
 $("#create").onclick=async()=>{try{state.person=$("#who").value.trim();localStorage.setItem("foodfun_person",state.person);let id=await call("create_shared_wallet",[["p_name","Our Monthly Voucher Wallet"],["p_display_name",state.person]]);await loadWallet(id);connectRealtime();render()}catch(e){alert(e.message||e)}};
 $("#join").onclick=async()=>{try{state.person=$("#who").value.trim();localStorage.setItem("foodfun_person",state.person);let id=await call("join_shared_wallet",[["p_join_code",$("#joinid").value.trim()],["p_display_name",state.person]]);await loadWallet(id);connectRealtime();render()}catch(e){alert(e.message||e)}};
}
function shell(){return `<div class="brand"><h1>🎟 Our Monthly Voucher Wallet</h1><div class="tag">Shared • saved • real-time</div></div><div class="tabs">${["wallet","dashboard","log","settings","share"].map(x=>`<button class="tab ${state.tab===x?"active":""}" data-tab="${x}">${{wallet:"Wallet",dashboard:"Dashboard",log:"Activity Log",settings:"Settings",share:"Share"}[x]}</button>`).join("")}</div><div class="panel" id="panel"></div>`}
function walletHTML(){let cs=state.wallet.categories.filter(c=>c.active),allow=cs.reduce((s,c)=>s+c.limit_count,0),u=cs.reduce((s,c)=>s+used(c),0);let cards=cs.map(c=>{let us=used(c),st=status(us,c.limit_count),boxes="";for(let i=1;i<=Math.max(10,c.limit_count);i++)boxes+=i<=c.limit_count?`<button class="v ${i<=us?"used":""}" data-voucher="${c.id}">#${i}<br>${i<=us?"USED":"available"}</button>`:`<button class="v lock" disabled>#${i}<br>locked</button>`;return `<div class="cat"><div class="cathead"><span>${c.icon} ${esc(c.name.toUpperCase())}</span><span class="pill ${st[1]}">${st[0]}</span></div><div class="catbody"><div class="meta">Limit <b>${c.limit_count}</b> | Used <b>${us}</b> | Remaining <b>${Math.max(0,c.limit_count-us)}</b></div><div class="vrow">${boxes}</div></div></div>`}).join("");return monthNav()+`<div class="summary"><div class="card"><div class="num">${allow}</div><div class="lbl">TOTAL ALLOWANCE</div></div><div class="card"><div class="num">${u}</div><div class="lbl">USED</div></div><div class="card"><div class="num">${Math.max(0,allow-u)}</div><div class="lbl">REMAINING</div></div><div class="card"><div class="num">${acts().length}</div><div class="lbl">ACTIVITIES</div></div></div><h2>🎟 Voucher Wallet</h2><p class="sub">Tap an available voucher to add an activity. The database enforces the monthly limit.</p><div class="cat-grid">${cards||"<div class='empty'>No active categories.</div>"}</div>`}
function monthNav(){return `<div class="month"><button id="prev">‹</button><strong>${monthLabel(state.month)}</strong><button id="next">›</button></div>`}
function dashboardHTML(){let as=acts(),cs=state.wallet.categories.filter(c=>c.active),total=as.reduce((s,a)=>s+Number(a.amount||0),0),rr=as.filter(a=>a.rating),ar=rr.length?rr.reduce((s,a)=>s+a.rating,0)/rr.length:0;let rows=cs.map(c=>{let st=status(used(c),c.limit_count);return `<tr><td>${c.icon} ${esc(c.name)}</td><td>${c.limit_count}</td><td>${used(c)}</td><td>${Math.max(0,c.limit_count-used(c))}</td><td>${c.limit_count?Math.round(used(c)/c.limit_count*100):0}%</td><td>${money(spent(c))}</td><td>${avg(c)?avg(c).toFixed(1):"–"}</td><td><span class="pill ${st[1]}">${st[0]}</span></td></tr>`}).join("");let mx=Math.max(1,...cs.map(spent));return monthNav()+`<div class="summary"><div class="card"><div class="num">${as.length}</div><div class="lbl">TOTAL VISITS</div></div><div class="card"><div class="num">${money(total)}</div><div class="lbl">TOTAL SPENT</div></div><div class="card"><div class="num">${ar?ar.toFixed(1):"–"}</div><div class="lbl">AVG RATING / 10</div></div><div class="card"><div class="num">${cs.reduce((s,c)=>s+Math.max(0,c.limit_count-used(c)),0)}</div><div class="lbl">REMAINING VOUCHERS</div></div></div><h2>📋 Category Summary</h2><div style="overflow:auto"><table><thead><tr><th>Category</th><th>Limit</th><th>Used</th><th>Remain</th><th>Usage</th><th>Spent</th><th>Avg ⭐</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div><div class="grid2" style="margin-top:12px"><div class="chart"><b>Voucher Usage</b>${cs.map(c=>`<div class="bar"><div>${c.icon} ${esc(c.name)}</div><div class="barbg"><div class="barin" style="width:${Math.min(100,used(c)/Math.max(1,c.limit_count)*100)}%"></div></div><div>${used(c)}</div></div>`).join("")}</div><div class="chart"><b>Spending by Category</b>${cs.map(c=>`<div class="bar"><div>${c.icon} ${esc(c.name)}</div><div class="barbg"><div class="barin" style="width:${Math.round(spent(c)/mx*100)}%"></div></div><div>${money(spent(c))}</div></div>`).join("")}</div></div><div class="notice">✓ ${state.wallet.name} is shared. Changes from either phone refresh automatically.</div>`}
function formHTML(a={}){let opts=state.wallet.categories.map(c=>`<option value="${c.id}" ${a.category_id===c.id?"selected":""}>${c.icon} ${esc(c.name)}</option>`).join("");return `<form id="activityForm"><div class="form"><div class="field"><label>Date</label><input name="date" type="date" required value="${a.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Category</label><select name="category_id" required>${opts}</select></div><div class="field"><label>Place / Store</label><input name="place" value="${esc(a.place||"")}"></div><div class="field"><label>Amount (optional)</label><input name="amount" type="number" min="0" step="1" value="${a.amount??""}"></div><div class="field"><label>Rating (1–10)</label><select name="rating"><option value="">–</option>${Array.from({length:10},(_,i)=>i+1).map(n=>`<option value="${n}" ${Number(a.rating)===n?"selected":""}>${n}</option>`).join("")}</select></div><div class="field"><label>Worth It?</label><select name="worth_it"><option value="">–</option><option ${a.worth_it==="Yes"?"selected":""}>Yes</option><option ${a.worth_it==="No"?"selected":""}>No</option></select></div><div class="field"><label>Suggested By</label><select name="suggested_by"><option value="">–</option>${["Me","Partner","Both","Spontaneous"].map(x=>`<option ${a.suggested_by===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Mood</label><select name="mood"><option value="">–</option>${["😊","🙂","😐","🙁","😫"].map(x=>`<option ${a.mood===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field wide"><label>Remarks</label><textarea name="remarks">${esc(a.remarks||"")}</textarea></div></div><div class="actions"><button class="btn primary" type="submit">${a.id?"Save Changes":"Save Activity"}</button>${a.id?'<button class="btn" type="button" id="cancelEdit">Cancel</button>':""}</div></form>`}
function logHTML(){let list=state.wallet.activities.slice().sort((a,b)=>b.date.localeCompare(a.date));let rows=list.map(a=>{let c=cat(a.category_id);return `<tr><td>${a.date}</td><td>${c?c.icon+" "+esc(c.name):"–"}</td><td>${esc(a.place||"–")}</td><td>${money(a.amount)}</td><td class="stars">${a.rating?stars(a.rating):"–"}</td><td>${a.worth_it||"–"}</td><td>${esc(a.created_by===state.user.id?"Me":"Partner")}</td><td><button class="btn" data-edit="${a.id}">Edit</button> <button class="btn danger" data-del="${a.id}">Delete</button></td></tr>`}).join("");return `<h2>📒 Activity Log</h2><p class="sub">Saved in the shared cloud database.</p>${formHTML(state.edit||{})}<h2>Saved Activities (${list.length})</h2><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Category</th><th>Place</th><th>Amount</th><th>Rating</th><th>Worth It</th><th>By</th><th>Actions</th></tr></thead><tbody>${rows||"<tr><td colspan='8' class='empty'>No activities yet.</td></tr>"}</tbody></table></div>`}
function settingsHTML(){let rows=state.wallet.categories.map(c=>`<div class="srow"><input type="checkbox" data-active="${c.id}" ${c.active?"checked":""}><input data-name="${c.id}" value="${esc(c.name)}"><input data-icon="${c.id}" value="${esc(c.icon)}"><input data-limit="${c.id}" type="number" min="0" value="${c.limit_count}"><button class="btn danger" data-hide="${c.id}">Hide</button></div>`).join("");return `<h2>⚙ Settings</h2><p class="sub">Change monthly limits here. The database enforces the limit for both phones.</p><div class="notice">Example: Fast Food = 5 → only five Fast Food activities can be saved in that month.</div><div class="srow" style="font-weight:800"><div>Active</div><div>Category</div><div>Icon</div><div>Limit</div><div></div></div>${rows}`}
function shareHTML(){return `<h2>🔗 Shared Wallet</h2><p class="sub">Give this Wallet ID to your partner.</p><div class="sharecode">${esc(state.wallet.join_code)}</div><div class="actions"><button class="btn primary" id="copyCode">Copy Wallet ID</button></div><div class="field" style="margin-top:14px"><label>Your display name</label><input id="person" value="${esc(state.person)}"></div><div class="actions"><button class="btn" id="savePerson">Save Name</button></div><div class="notice">✓ Live sync is active. <span class="statusline">If one person adds an activity, the other connected phone refreshes automatically.</span></div>`}

function render(){if(!state.wallet){setupPage();return}document.getElementById("app").innerHTML=shell();renderPanelOnly()}
function renderPanelOnly(){const p=$("#panel");if(!p)return;if(state.tab==="wallet")p.innerHTML=walletHTML();else if(state.tab==="dashboard")p.innerHTML=dashboardHTML();else if(state.tab==="log")p.innerHTML=logHTML();else if(state.tab==="settings")p.innerHTML=settingsHTML();else p.innerHTML=shareHTML();attach()}
async function saveActivity(e){e.preventDefault();const fd=new FormData(e.target);const b=Object.fromEntries(fd.entries());b.amount=Number(b.amount||0);b.rating=b.rating?Number(b.rating):null;b.created_by=state.user.id;try{if(state.edit){let{error}=await sb.from("activities").update(b).eq("id",state.edit).eq("wallet_id",state.wallet.id);if(error)throw error;toast("Activity updated and synced")}else{let{error}=await sb.from("activities").insert({...b,wallet_id:state.wallet.id});if(error)throw error;toast("Activity saved and synced")}state.edit=null;tabToWallet()}catch(e){alert(e.message||e)}}
function tabToWallet(){state.tab="wallet";render()}
function connectRealtime(){if(!sb||!state.wallet)return;if(state.channel)state.channel.unsubscribe();state.channel=sb.channel("wallet-"+state.wallet.id).on("postgres_changes",{event:"*",schema:"public",table:"activities",filter:"wallet_id=eq."+state.wallet.id},()=>refresh()).on("postgres_changes",{event:"*",schema:"public",table:"categories",filter:"wallet_id=eq."+state.wallet.id},()=>refresh()).subscribe()}
function attach(){
 $("#prev")?.addEventListener("click",()=>{state.month=monthShift(state.month,-1);renderPanelOnly()});
 $("#next")?.addEventListener("click",()=>{state.month=monthShift(state.month,1);renderPanelOnly()});
 $$("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.edit=null;render()});
 $$("[data-voucher]").forEach(b=>b.onclick=()=>{state.tab="log";state.edit=null;render();setTimeout(()=>{let f=$("#activityForm");if(f)f.category_id.value=b.dataset.voucher},0)});
 $("#activityForm")?.addEventListener("submit",saveActivity);
 $("#cancelEdit")?.addEventListener("click",()=>{state.edit=null;renderPanelOnly()});
 $$("[data-edit]").forEach(b=>b.onclick=()=>{state.edit=b.dataset.edit;state.tab="log";render()});
 $$("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this activity?")){let{error}=await sb.from("activities").delete().eq("id",b.dataset.del).eq("wallet_id",state.wallet.id);if(error)alert(error.message);else toast("Deleted and synced")}});
 $$("[data-limit]").forEach(x=>x.onchange=()=>updateCat(x.dataset.limit,{limit_count:Math.max(0,parseInt(x.value,10)||0)}));
 $$("[data-name]").forEach(x=>x.onchange=()=>updateCat(x.dataset.name,{name:x.value||"Untitled"}));
 $$("[data-icon]").forEach(x=>x.onchange=()=>updateCat(x.dataset.icon,{icon:x.value||"✨"}));
 $$("[data-active]").forEach(x=>x.onchange=()=>updateCat(x.dataset.active,{active:x.checked,limit_count:x.checked?cat(x.dataset.active).limit_count:0}));
 $$("[data-hide]").forEach(x=>x.onclick=()=>updateCat(x.dataset.hide,{active:false,limit_count:0}));
 $("#copyCode")?.addEventListener("click",async()=>{await navigator.clipboard.writeText(state.wallet.join_code);toast("Wallet ID copied")});
 $("#savePerson")?.addEventListener("click",async()=>{let{error}=await sb.from("wallet_members").update({display_name:$("#person").value.trim()}).eq("wallet_id",state.wallet.id).eq("user_id",state.user.id);if(error)alert(error.message);else{state.person=$("#person").value.trim();localStorage.setItem("foodfun_person",state.person);toast("Name saved")}});
}
async function updateCat(id,patch){let c=cat(id);let body={name:patch.name??c.name,icon:patch.icon??c.icon,limit_count:patch.limit_count??c.limit_count,active:patch.active??c.active};let{error}=await sb.from("categories").update(body).eq("id",id).eq("wallet_id",state.wallet.id);if(error)alert(error.message)}
async function boot(){
 if(!hasConfig){document.getElementById("app").innerHTML=`<div class="authbox"><h2>Supabase setup required</h2><p>Open <b>config.js</b> and paste your Supabase project URL and public publishable/anon key.</p></div>`;return}
 try{
  await ensureAuth();
  let id=localStorage.getItem("foodfun_wallet");
  if(id){try{await loadWallet(id);connectRealtime()}catch{localStorage.removeItem("foodfun_wallet")}}
  render();
 }catch(e){document.getElementById("app").innerHTML=`<div class="authbox"><h2>Setup error</h2><p>${esc(e.message||e)}</p></div>`}
}
boot();
</script>
